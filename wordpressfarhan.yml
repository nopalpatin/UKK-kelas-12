---
- hosts: blog  # Fixed: was 'host' (missing 's')
  become: yes

  vars:
    mysql_root_password: "root"
    mysql_user: "cyber"
    mysql_user_password: "pass2023"
    db_name: "cyber23"
    git_repo: "https://github.com/jonisetiyawan48/ukk_tkj_2.git"  # Fixed: was 'git repo' (space removed)
    web_root: "/var/www/html"

  tasks:  # Fixed: was 'task' (missing 's')
    - name: Install apache2
      apt:
        name: apache2
        state: present
        update_cache: true

    - name: Install mysql server and python dependencies
      apt:
        name:
          - "mysql-server"
          - "python3-pymysql"
        state: present

    - name: Set MySQL password  # Fixed: was 'mySQL' (capitalization)
      command: mysql -u root -e 'ALTER USER "root"@"localhost" IDENTIFIED WITH mysql_native_password BY "{{ mysql_root_password }}";'
      when: mysql_root_password is defined
      ignore_errors: true

    - name: Create blog database
      mysql_db:
        name: "{{ db_name }}"
        state: present
        login_user: root
        login_password: "{{ mysql_root_password }}"

    - name: Create MySQL user  # Fixed: was 'mySQL' (capitalization)
      community.mysql.mysql_user:
        name: "{{ mysql_user }}"
        password: "{{ mysql_user_password }}"
        priv: "{{ db_name }}.*:ALL"
        state: present
        host: localhost
        login_user: root
        login_password: "{{ mysql_root_password }}"
  
    - name: Install php and dependencies
      apt:
        name:
          - "php8.3"
          - "php8.3-mysqli"
          - "php8.3-mbstring"
          - "git"
        state: present

    - name: Check if web root directory exists
      stat:
        path: "{{ web_root }}"
      register: web_root_stat

    - name: Ensure web root directory is empty
      command: rm -rf {{ web_root }}
      when: web_root_stat.stat.exists and web_root_stat.stat.isdir

    - name: Clone Git repository if not present
      git:
        repo: "{{ git_repo }}"
        dest: "{{ web_root }}/"
        update: yes

    - name: Import SQL file into database
      mysql_db:
        name: "{{ db_name }}"
        state: import
        target: "{{ web_root }}/db.sql"
        login_user: root
        login_password: "{{ mysql_root_password }}"
